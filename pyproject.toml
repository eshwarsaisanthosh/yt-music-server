[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-music-server"
version = "0.1.0"
description = "Private backend for a personal iOS music player: YouTube URL ingestion, chapter splitting, ALAC library, REST API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
